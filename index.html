<!DOCTYPE html>
<html>

<head>
    <title>Projeto AR - UI Responsiva com Bootstrap</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Camada de UI deve permitir que o A-Frame detecte gestos no fundo */
        .ui-overlay {
            z-index: 9999;
            pointer-events: none;
            /* Cliques passam através da div para o A-Frame */
        }

        /* Botões devem ser clicáveis */
        .ui-overlay .btn {
            pointer-events: auto;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="ui-overlay container-fluid fixed-bottom pb-4">
        <div class="row justify-content-center">
            <div class="col-auto d-flex flex-wrap justify-content-center gap-3">
                <button class="btn btn-danger btn-lg shadow-lg px-4 fw-bold" id="btn-andar">Andar</button>
                <button class="btn btn-danger btn-lg shadow-lg px-4 fw-bold" id="btn-atacar">Atacar</button>
                <button class="btn btn-danger btn-lg shadow-lg px-4 fw-bold" id="btn-morrer">Morrer</button>
            </div>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" gesture-detector xr-mode-ui="enabled: false">

        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="directional" intensity="1" position="1 3 1"></a-light>

        <a-entity camera></a-entity>

        <a-marker preset="hiro">
            <a-entity id="modelo-aranha" class="tocavel" gltf-model="aranhaComTextura.glb" scale="2.5 2.5 2.5"
                position="0 0 0" gesture-handler animation-mixer="clip: recluse_spider_walk; loop: repeat">
            </a-entity>
        </a-marker>

    </a-scene>

    <script>
        window.onload = function () {
            const aranha = document.querySelector('#modelo-aranha');

            // --- Ação de Andar ---
            document.querySelector('#btn-andar').onclick = () => {
                aranha.setAttribute('animation-mixer', 'clip: recluse_spider_walk; loop: repeat; crossFadeDuration: 0.3');
            };

            // --- Ação de Atacar (Corrigida) ---
            document.querySelector('#btn-atacar').onclick = () => {
                // 1. Removemos a animação para "limpar" o estado anterior
                aranha.removeAttribute('animation-mixer');
                
                // 2. Aguardamos 10 milissegundos e readicionamos a animação. 
                // Isso força o A-Frame a recomeçar o ataque a partir do frame zero!
                setTimeout(() => {
                    aranha.setAttribute('animation-mixer', 'clip: recluse_spider_attack; loop: once; crossFadeDuration: 0.1');
                }, 10);
            };

            // --- Ação de Morrer ---
            document.querySelector('#btn-morrer').onclick = () => {
                aranha.removeAttribute('animation-mixer');
                
                setTimeout(() => {
                    aranha.setAttribute('animation-mixer', 'clip: recluse_spider_death; loop: once; clampWhenFinished: true; crossFadeDuration: 0.3');
                }, 10);
            };
        };
    </script>
</body>

</html>
