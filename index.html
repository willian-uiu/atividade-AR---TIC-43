<!DOCTYPE html>
<html>

<head>
    <title>Projeto AR - UI Interativa</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
        .botoes-ui {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 9999; /* Garante que os botões fiquem por cima da câmera */
            pointer-events: none; /* Deixa a tela clicável para os gestos... */
        }

        .btn-acao {
            pointer-events: auto; /* ...mas ativa o clique apenas nos botões */
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-acao:active {
            background-color: #ff6b81;
            transform: scale(0.95);
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="botoes-ui">
        <button class="btn-acao" id="btn-andar">Andar</button>
        <button class="btn-acao" id="btn-atacar">Atacar</button>
        <button class="btn-acao" id="btn-morrer">Morrer</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" gesture-detector xr-mode-ui="enabled: false">
        
        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="directional" intensity="1" position="1 3 1"></a-light>

        <a-entity camera></a-entity>
        
        <a-marker preset="hiro">
            <a-entity 
                id="modelo-aranha"
                class="tocavel" 
                gltf-model="aranhaComTextura.glb" 
                scale="2.5 2.5 2.5" 
                position="0 0 0"
                gesture-handler
                animation-mixer="clip: recluse_spider_walk; loop: repeat">
            </a-entity>
        </a-marker>
        
    </a-scene>

    <script>
        // Aguarda a página carregar
        window.onload = function () {
            // Pega a referência da aranha e dos botões
            const aranha = document.querySelector('#modelo-aranha');
            const btnAndar = document.querySelector('#btn-andar');
            const btnAtacar = document.querySelector('#btn-atacar');
            const btnMorrer = document.querySelector('#btn-morrer');

            // Adiciona a ação de clique para cada botão
            btnAndar.addEventListener('click', function () {
                aranha.setAttribute('animation-mixer', 'clip: recluse_spider_walk; loop: repeat; crossFadeDuration: 0.3');
            });

            btnAtacar.addEventListener('click', function () {
                aranha.setAttribute('animation-mixer', 'clip: recluse_spider_gothit; loop: once; crossFadeDuration: 0.3');
            });

            btnMorrer.addEventListener('click', function () {
                // loop: once (toca uma vez e para) e clampWhenFinished: true (fica caída no chão)
                aranha.setAttribute('animation-mixer', 'clip: recluse_spider_death; loop: once; clampWhenFinished: true; crossFadeDuration: 0.3');
            });
        };
    </script>
</body>

</html>
